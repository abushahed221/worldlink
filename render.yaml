services:
  - type: web
    name: worldlink
    env: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: "bash build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: REDIS_URL
        fromService:
          type: redis
          name: worldlink-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: worldlink-db
          property: connectionString
      - key: ADMIN_URL_PATH
        value: wl-panel-x7k9m2
      - key: ADMIN_ALLOWED_IPS
        value: ""
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
    disk:
      name: worldlink-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1

  - type: redis
    name: worldlink-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: worldlink-db
    databaseName: worldlink
    user: worldlink
    region: frankfurt
    plan: free