{% extends "posts/base.html" %}
{% block content %}
<div class="card">
    <h2>تعديل الملف الشخصي</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">حفظ</button>
        <a href="{% url 'profile' user.username %}" class="btn btn-secondary">إلغاء</a>
    </form>
</div>
{% endblock %}
