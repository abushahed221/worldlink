{% extends "posts/base.html" %}
{% block title %}منشور جديد | WorldLink{% endblock %}
{% block content %}
<div class="card">
    <h2 style="font-size:18px; margin-bottom:14px;">✍️ اكتب منشورك</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <textarea name="content" rows="4" placeholder="اكتب فكرة أو سؤالًا للعالم..." maxlength="2000"></textarea>

        <div class="attach-bar">
            <label class="attach-btn">
                📷 صورة رئيسية
                <input type="file" name="image" id="cp_image" accept="image/*"
                       onchange="showFileName(this, 'cp_image_info')">
            </label>
            <label class="attach-btn">
                🖼️ صور متعددة
                <input type="file" name="images" id="cp_images" accept="image/*" multiple
                       onchange="previewImages(this, 'cp_images_preview')">
            </label>
            <label class="attach-btn">
                🎬 فيديو
                <input type="file" name="video" id="cp_video" accept="video/*"
                       onchange="showFileName(this, 'cp_video_info')">
            </label>
        </div>

        <div id="cp_image_info" class="file-info" style="display:none;"></div>
        <div id="cp_images_preview" class="preview-grid"></div>
        <div id="cp_video_info" class="file-info" style="display:none;"></div>

        <div style="margin-top:12px;">
            <button type="submit" class="btn">📤 نشر</button>
            <a href="{% url 'home' %}" class="btn btn-secondary">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
