{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>غير متصل | WorldLink</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            color: #1c1e21;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .box img { width: 80px; margin: 0 auto 20px; display: block; }
        .box h1 { font-size: 22px; margin: 0 0 12px; color: #1769aa; }
        .box p { color: #65676b; margin: 0 0 20px; line-height: 1.6; }
        .box button {
            background: #1769aa; color: white; padding: 12px 24px;
            border: 0; border-radius: 10px; cursor: pointer;
            font-size: 15px; font-weight: 600;
        }
        .box button:hover { background: #125488; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/static/icon.svg" alt="WorldLink">
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>يبدو أنك غير متصل حاليًا. تحقق من اتصالك وحاول مرة أخرى.</p>
        <button onclick="window.location.href='/'">🔄 إعادة المحاولة</button>
    </div>
</body>
</html>
